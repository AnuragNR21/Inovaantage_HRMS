<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Inovaantage Payroll Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-icon"><img class="login-brand-logo" src="/assets/inovaantage-logo.png" alt="Inovaantage"></div>
    <h1>Reset Password</h1>
    <p class="subtitle">Enter a new password for your account.</p>
    <div id="alertBox"></div>
    <form class="login-form" id="resetPasswordForm">
      <div class="form-group"><label for="newPassword">New Password</label><input type="password" id="newPassword" autocomplete="new-password" required minlength="12" maxlength="72"></div>
      <div class="form-group"><label for="confirmPassword">Confirm New Password</label><input type="password" id="confirmPassword" autocomplete="new-password" required minlength="12" maxlength="72"></div>
      <button type="submit" class="btn btn-primary btn-block" id="resetPasswordBtn">Reset Password</button>
    </form>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
